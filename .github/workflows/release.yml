# Publishes an editor release when a version tag is pushed (git tag v0.1.0-alpha.1; git push origin v0.1.0-alpha.1): builds
# the editor in Release once CI has passed on the tagged commit, zips the editor with its players, free fonts, LICENSE and third-party
# notices and packs the same as the installer and its updates with Velopack (tools/release.ps1, which you can run
# yourself), and publishes a GitHub Release with all of it, whose notes are the commits since the previous tag
# (tools/release-notes.ps1). A tag with a pre-release label (v0.1.0-alpha.1) makes a pre-release on the "prerelease"
# update channel; a plain one (v0.1.0) a release on "stable". The site's Releases page and Download button list it once the
# Site workflow it starts has run. See site/README.md, "Cutting a release".
name: Release

on:
  push:
    # v0.1.0, and pre-releases like v0.1.0-alpha.1 (tools/release.ps1 checks the rest of the label).
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

# Building only reads the repository (and CI's runs); the one job that publishes gets contents: write.
permissions:
  contents: read
  actions: read

# A tag is released once; a second push of the same tag waits rather than racing it.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The tests are CI's: it ran both suites on this commit, as here, and the release waits for that run and needs it to
      # have passed. Running them again only gave the runner's software OpenGL, which refuses contexts now and then, a second
      # chance to fail a commit CI had passed.
      - name: Check CI passed on this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for ($minutes = 0; ; $minutes++) {
            $runs = @(gh run list --workflow ci.yml --commit $env:SHA --json status,conclusion | ConvertFrom-Json)
            if ($runs | Where-Object conclusion -eq 'success') { break }
            if (-not ($runs | Where-Object status -ne 'completed') -or $minutes -ge 60) {
              Write-Error "CI hasn't passed on $env:SHA (Actions, CI): run it again there, then the release."
              exit 1
            }
            Start-Sleep -Seconds 60
          }

      # All history and tags, so the notes can see the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The runners have no GPU; Mesa's software OpenGL lets the player smoke test draw a frame.
      - uses: ssciwr/setup-mesa-dist-win@v3
        with:
          deployment-choice: '1'

      # Velopack's vpk, from dotnet-tools.json.
      - name: Restore the tools
        run: dotnet tool restore

      # The previous release's full package on this tag's channel, so the pack makes a delta update from it (none before
      # the first). Reading the public releases needs no write permission.
      - name: Fetch the previous release's package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = $env:TAG.Contains('-')
          $channel = if ($pre) { 'prerelease' } else { 'stable' }
          $arguments = @('vpk', 'download', 'github', '--repoUrl', "https://github.com/$env:GITHUB_REPOSITORY", '--channel', $channel, '--token', $env:GH_TOKEN, '--outputDir', 'artifacts/release/velopack', '--skip-updates')
          if ($pre) { $arguments += '--pre' }
          dotnet @arguments

      # The tag is vMAJOR.MINOR.PATCH[-label], the version is the tag without its v.
      - name: Build the release zip and the installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          ./tools/release.ps1 -Version $version

      - name: Write the release notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/release-notes.ps1 -Tag $env:TAG -Out artifacts/release/release-notes.md

      # The Velopack folder as vpk left it (vpk upload reads it whole, and uploads only this version's files).
      - name: Keep the zip, the installer and the notes for the release
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            artifacts/release/*.zip
            artifacts/release/release-notes.md
            artifacts/release/velopack/
          if-no-files-found: error

  publish:
    needs: build
    # vpk uploads the Velopack files; it reads the Windows packages the build made.
    runs-on: windows-latest
    permissions:
      contents: write # the release and its files
      actions: write  # to start the Site workflow, which lists the new release
    steps:
      # Only what the tools need: global.json and dotnet-tools.json.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            global.json
            dotnet-tools.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the tools
        run: dotnet tool restore

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # A draft first, with the zip and the notes; vpk adds the installer, the packages and the feed to it and publishes
      # it, so the release appears with everything at once. A pre-release tag (v0.1.0-alpha.1) makes a GitHub pre-release.
      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          $pre = $env:TAG.Contains('-')
          $channel = if ($pre) { 'prerelease' } else { 'stable' }
          $create = @('release', 'create', $env:TAG, (Get-Item release/*.zip).FullName, '--verify-tag', '--draft', '--title', "Griff $version", '--notes-file', 'release/release-notes.md')
          if ($pre) { $create += '--prerelease' }
          gh @create
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $upload = @('vpk', 'upload', 'github', '--repoUrl', "https://github.com/$env:GH_REPO", '--token', $env:GH_TOKEN, '--tag', $env:TAG, '--releaseName', "Griff $version", '--channel', $channel, '--outputDir', 'release/velopack', '--merge', '--publish', '--skip-updates')
          if ($pre) { $upload += '--pre' }
          dotnet @upload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Published either way, also if vpk found it published already.
          gh release edit $env:TAG --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A release made with the workflow's own token starts no other workflow, so the site is started by hand.
      - name: Rebuild the site, so the Releases page lists it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml --ref main
