# Builds the editor (and the players it publishes) and runs both test projects on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The runners have no GPU; Mesa's software OpenGL lets the player smoke test draw a frame.
      - uses: ssciwr/setup-mesa-dist-win@v3
        with:
          deployment-choice: '1'

      - name: Build
        id: build
        run: dotnet build src/Griff.Editor/Griff.Editor.csproj

      # Each test's result goes to the log as it finishes, and to a .trx file kept with the run when one fails. The editor's
      # tests run even when the engine's fail.
      - name: Engine tests
        run: dotnet test tests/Griff.Tests --logger "console;verbosity=normal" --logger "trx;LogFileName=engine.trx" --results-directory TestResults --blame-hang-timeout 10m

      - name: Editor tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/Griff.Editor.Tests --logger "console;verbosity=normal" --logger "trx;LogFileName=editor.trx" --results-directory TestResults --blame-hang-timeout 10m

      # Each failed test as an annotation on the run (its name and the first lines of its message and stack), which the
      # run's page and the public API show without signing in, unlike the log and the kept results.
      - name: Name the failed tests
        if: ${{ failure() }}
        shell: pwsh
        run: ./tools/test-failures.ps1 -Results TestResults

      - name: Keep the test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
