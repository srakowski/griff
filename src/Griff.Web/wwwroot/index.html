<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Griff</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      color: #ddd; font: 16px system-ui, sans-serif; text-align: center; white-space: pre-wrap; pointer-events: none;
    }
    #status.failed { color: #ff8080; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="status">Loading…</div>
  <script type="module" src="main.js"></script>
</body>
</html>
