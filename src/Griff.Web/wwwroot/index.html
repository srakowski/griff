<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Griff</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
    /* The game fills the page, drawn at the screen's own pixels (see griff.js); pixel art stays sharp if it's scaled up. */
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; image-rendering: pixelated; }
    .over { position: fixed; font: 16px system-ui, sans-serif; color: #ddd; box-sizing: border-box; }
    #loading {
      inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px;
      background: #14161b; text-align: center;
    }
    #loading[hidden], #notice[hidden], #hint[hidden] { display: none; }
    #title { font-size: 28px; font-weight: 600; color: #f0f0f0; max-width: 90vw; overflow-wrap: anywhere; }
    #bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #2a2e37; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #4c9aff; transition: width 0.15s; }
    #status { color: #9aa0ab; white-space: pre-wrap; max-width: 90vw; }
    #loading.failed #status { color: #ff8080; }
    #loading.failed #bar, #loading.ended #bar { display: none; }
    #notice {
      top: 12px; left: 50%; transform: translateX(-50%); max-width: min(640px, calc(100vw - 32px)); padding: 10px 14px;
      border-radius: 8px; background: rgba(20, 22, 27, 0.92); border: 1px solid #f0a64c; color: #f5d7b0; cursor: pointer;
    }
    #hint {
      bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px;
      background: rgba(20, 22, 27, 0.8); color: #c8ccd4; font-size: 14px; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="loading" class="over">
    <div id="title">Griff</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="status">Loading…</div>
  </div>
  <div id="notice" class="over" role="status" title="Click to close" hidden></div>
  <div id="hint" class="over" hidden>Click or press a key for sound</div>
  <script type="module" src="main.js"></script>
</body>
</html>
