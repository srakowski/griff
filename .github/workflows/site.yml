# Builds griff.games from site/ (Astro Starlight), checks it has no broken links, and deploys it to GitHub Pages on every
# push to main. The repository's Pages source must be "GitHub Actions" (see site/README.md).
name: Site

on:
  push:
    branches: [main]
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

# Only what deploying to Pages needs; the build job reads the repository and nothing else.
permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check-links

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
