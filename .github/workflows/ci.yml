# Builds the editor (and the players it publishes) and runs both test projects on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The runners have no GPU; Mesa's software OpenGL lets the player smoke test draw a frame.
      - uses: ssciwr/setup-mesa-dist-win@v3
        with:
          deployment-choice: '1'

      - name: Build
        run: dotnet build src/Griff.Editor/Griff.Editor.csproj

      - name: Engine tests
        run: dotnet test tests/Griff.Tests

      - name: Editor tests
        run: dotnet test tests/Griff.Editor.Tests
